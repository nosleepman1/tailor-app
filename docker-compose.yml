services:
  frontend:
    build: ./client
    container_name: tailor-app-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - ./client/node_modules:/app/node_modules
    networks:
      - tailor-app-network

  backend:
    build: ./server
    container_name: tailor-app-server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/var/www/html
      - ./server/storage/app/public:/var/www/html/storage/app/public
    networks:
      - tailor-app-network
  
  nginx:
    build: ./nginx
    container_name: tailor-app-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    networks:
      - tailor-app-network
  
  db:
    image: postgres:18.1-alpine
    container_name: tailor-app-db
    ports:
      - "5432:5432"
    volumes:
      - ./db:/var/lib/postgresql/data
    networks:
      - tailor-app-network

  redis:
    image: redis:8.4.0-alpine
    container_name: tailor-app-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data
    networks:
      - tailor-app-network

