name: Production CD (Self-Hosted Runner)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_migration:
        description: 'Run database migrations'
        required: false
        default: true
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Deploy Directly on Local VM Ubuntu Server (Self-Hosted)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy on Self-Hosted VM
    runs-on: [self-hosted, linux]
    environment: production

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Prepare Production Environment (.env.production)
        run: |
          if [ ! -f ./server/.env.production ]; then
            if [ -n "${{ secrets.PROD_ENV_FILE }}" ]; then
              echo "${{ secrets.PROD_ENV_FILE }}" > ./server/.env.production
            else
              cp ./server/.env.production.example ./server/.env.production
            fi
            chmod 600 ./server/.env.production
          fi

      - name: Build & Start Production Containers (Docker Compose)
        run: |
          docker compose -f docker-compose.prod.yml build --pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Verify API HealthCheck (/up Endpoint)
        run: |
          echo "⏳ Vérification de santé du conteneur API (http://localhost:8080/up)..."
          max_attempts=30
          counter=0
          until curl -f -s http://localhost:8080/up >/dev/null 2>&1; do
            counter=$((counter + 1))
            if [ $counter -gt $max_attempts ]; then
              echo "❌ Erreur: L'API ne répond pas au HealthCheck après ${max_attempts} tentatives."
              docker compose -f docker-compose.prod.yml logs backend
              exit 1
            fi
            sleep 2
          done
          echo "✅ API en ligne et opérationnelle (HTTP 200 sur /up) !"

      - name: Run Database Migrations
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force --no-interaction

      - name: Optimize Laravel Caches
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend php artisan optimize

      - name: Clean Dangling Docker Images
        if: always()
        run: |
          docker image prune -f || true

      - name: Send Notification (Optional)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚀 *TailleurPro Déploiement Réussi sur VM Self-Hosted*\n*Commit:* \`${{ github.sha }}\`\n*Auteur:* ${{ github.actor }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true
