name: Production CD (Self-Hosted Runner)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_migration:
        description: 'Force database migrations'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Build & Push Production Docker Image to GHCR
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 2. Deploy on Self-Hosted VPS Runner
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Self-Hosted Server
    needs: build-and-push
    # Runs on your VPS self-hosted runner
    runs-on: [self-hosted, linux]
    environment: production

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry on Server
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Setup Production Environment File
        run: |
          if [ ! -f ./server/.env.production ] && [ -n "${{ secrets.PROD_ENV_FILE }}" ]; then
            echo "${{ secrets.PROD_ENV_FILE }}" > ./server/.env.production
            chmod 600 ./server/.env.production
          fi

      - name: Pull Latest Docker Images
        run: |
          docker compose -f docker-compose.prod.yml pull

      - name: Deploy Production Containers
        run: |
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Verify Container Health (/up Endpoint)
        run: |
          echo "⏳ Attente du démarrage et vérification de santé du conteneur API..."
          max_attempts=30
          counter=0
          until curl -f -s http://localhost:8080/up >/dev/null 2>&1; do
            counter=$((counter + 1))
            if [ $counter -gt $max_attempts ]; then
              echo "❌ Erreur: L'API ne répond pas au HealthCheck après ${max_attempts} tentatives."
              docker compose -f docker-compose.prod.yml logs backend
              exit 1
            fi
            sleep 2
          done
          echo "✅ API en ligne et opérationnelle (HTTP 200 sur /up) !"

      - name: Clean Dangling Docker Images
        if: always()
        run: |
          docker image prune -f || true

  # ─────────────────────────────────────────────────────────────
  # 3. Notification of Deployment Status
  # ─────────────────────────────────────────────────────────────
  notify:
    name: Notify Deployment Status
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send Slack / Discord Notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "Statut de Déploiement Production TailleurPro",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*TailleurPro — Déploiement Self-Hosted*\n*Statut :* ${{ needs.deploy.result == 'success' && '🟢 Succès' || '🔴 Échec' }}\n*Commit :* `${{ github.sha }}`\n*Auteur :* ${{ github.actor }}"
                  }
                }
              ]
            }
