name: Continuous Integration (CI - Self-Hosted)

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Code Quality & Automated Tests
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (PHP 8.3 & Postgres 16)
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pdo_sqlite, redis, mbstring, zip, pcntl, bcmath, gd, intl, opcache
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify Code Style (Laravel Pint)
        run: |
          ./vendor/bin/pint --test

      - name: Setup Testing Environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Run Pest & PHPUnit Automated Tests
        run: |
          php artisan test --env=testing
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Build & Assets Check
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node.js 20)
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Build Frontend Application
        run: |
          npm run build
