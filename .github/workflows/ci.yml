name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Linting, Quality & Automated Tests
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (PHP 8.3 & Postgres 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tailor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret_postgres_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pdo_sqlite, redis, mbstring, zip, pcntl, bcmath, gd, intl, opcache
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: server/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify Code Style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Setup Testing Environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tailor_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret_postgres_pass
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
          QUEUE_CONNECTION: sync

      - name: Run Database Migrations
        run: php artisan migrate --env=testing --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tailor_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret_postgres_pass

      - name: Execute Automated Test Suite (Pest / PHPUnit)
        run: ./vendor/bin/pest --ci
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tailor_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret_postgres_pass
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
          QUEUE_CONNECTION: sync

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Build & Quality Check
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # 3. Security & Secret Leak Scanning
  # ─────────────────────────────────────────────────────────────
  security-scan:
    name: Security & Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Leaked Secrets (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --only-verified
        continue-on-error: true
